[project]
name = "specdiff"
version = "0.1.0"
description = "Diff and visualize the changes between versions of the Bluetooth Core Specification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "pymupdf>=1.26",
]

[project.scripts]
specdiff = "specdiff.cli:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "N", "S"]
ignore = ["S310"]  # urllib only ever opens the fixed bluetooth.com / bluetooth.org URLs

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"
